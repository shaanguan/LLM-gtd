<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTD</title>
<style>
:root{color-scheme:light;--bg:#F8F8F7;--s:#FFF;--s2:#F3F3F1;--b:rgba(0,0,0,.06);--b2:rgba(0,0,0,.03);--t:#1A1A1A;--t2:#6B6B6B;--t3:#ABABAB;--blue:#3B6CE7;--blueS:#EBF0FC;--red:#E5484D;--redS:#FDECEE;--amber:#E79D13;--amberS:#FEF4E4;--green:#30A46C;--greenS:#E9F9EF;--purple:#8E4EC6;--purpleS:#F3ECFB;--r:10px;--sh:0 2px 8px rgba(0,0,0,.04),0 0 0 1px rgba(0,0,0,.04)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"SF Pro Display","Inter",system-ui,sans-serif;background:var(--bg);color:var(--t);line-height:1.55;-webkit-font-smoothing:antialiased;padding:32px;max-width:960px;margin:0 auto}
a{color:inherit;text-decoration:none}
.header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:32px}
.ht{font-size:13px;font-weight:500;color:var(--t3);letter-spacing:.5px;text-transform:uppercase}
.hd{font-size:28px;font-weight:700;letter-spacing:-.5px;margin-top:2px;display:flex;align-items:center;gap:8px}
.rb{width:24px;height:24px;border:none;border-radius:6px;background:var(--s2);color:var(--t3);font-size:13px;line-height:1;cursor:pointer;transition:all .12s;display:inline-flex;align-items:center;justify-content:center}.rb:hover{background:var(--blueS);color:var(--blue)}.rb.busy{animation:spin .8s linear infinite;color:var(--blue)}@keyframes spin{to{transform:rotate(360deg)}}
.pb{text-align:right}.pl{font-size:11px;color:var(--t3);font-weight:500;letter-spacing:.3px;text-transform:uppercase}
.pn{font-size:36px;font-weight:800;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,var(--blue),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1}
.pu{font-size:13px;font-weight:500;color:var(--t3)}
.sec{margin-bottom:24px}.sl{font-size:11px;font-weight:600;color:var(--t3);letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px;padding-left:2px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--s);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column}
.ch{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--b2);flex-shrink:0}
.ct{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.cc{font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums}
.cb{flex:1}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.dr{background:var(--red)}.da{background:var(--amber)}.db{background:var(--blue)}.dg{background:var(--green)}.dp{background:var(--purple)}
.it{padding:10px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--b2);transition:background .1s;cursor:pointer}
.it:last-child{border-bottom:none}.it:hover{background:var(--s2)}
.ic{flex:1;min-width:0}.in{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.is{font-size:11px;color:var(--t3);margin-top:1px;display:flex;gap:8px;align-items:center}
.ir{flex-shrink:0;display:flex;align-items:center;gap:6px}
.bd{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;letter-spacing:.2px;white-space:nowrap}
.bp1{background:var(--redS);color:var(--red)}.bp2{background:var(--amberS);color:var(--amber)}.bp3{background:var(--blueS);color:var(--blue)}
.bk{background:var(--s2);color:var(--t2);font-weight:500}
.bov{background:var(--red);color:#fff}.btd{background:var(--redS);color:var(--red)}.bsn{background:var(--amberS);color:var(--amber)}.blt{background:var(--s2);color:var(--t3)}
.bach{background:var(--greenS);color:var(--green)}
.kr-row{padding:14px 18px;border-bottom:1px solid var(--b2)}.kr-row:last-child{border-bottom:none}
.kr-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.kr-name{font-size:13px;font-weight:600}
.kr-nums{font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums;display:flex;gap:12px}
.kr-bar{width:100%;height:4px;background:var(--s2);border-radius:2px;overflow:hidden;margin-bottom:8px}
.kr-fill{height:100%;border-radius:2px;transition:width .8s cubic-bezier(.16,1,.3,1)}
.kr-achs{display:flex;gap:6px;flex-wrap:wrap}
.kr-ach{font-size:10px;padding:2px 7px;border-radius:4px;background:var(--greenS);color:var(--green);font-weight:500}
.kr-empty{font-size:11px;color:var(--t3);font-style:italic}
.o-label{padding:12px 18px 4px;font-size:11px;font-weight:600;color:var(--t3);letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid var(--b2)}
.plb{padding:10px 18px 4px;font-size:11px;font-weight:600;color:var(--purple);letter-spacing:.2px}
.fb{display:flex;gap:4px;padding:10px 18px;border-bottom:1px solid var(--b2);flex-shrink:0}
.fn{font-size:11px;font-weight:500;padding:4px 10px;border-radius:6px;border:none;background:transparent;color:var(--t3);cursor:pointer;transition:all .12s}
.fn:hover{background:var(--s2);color:var(--t2)}.fn.on{background:var(--t);color:#fff}
.em{padding:20px 18px;font-size:12px;color:var(--t3);text-align:center}
.blw{opacity:.7}.blw:hover{opacity:1}
.sync{font-size:10px;color:var(--t3);text-align:right;padding:8px 0 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ───── Injected by export_dashboard.py ─────────────────────────────
 * DATA   — array of {fn,title,type,project,due,deadline,priority,okr,owner,date,bl}
 * SYNC   — last sync timestamp (YYYY-MM-DD HH:MM)
 * VBASE  — absolute path to the vault root (used for file:// links)
 * OKR    — optional {ON:{O1:'…','O1-KR1':'…',…}, OC:{O1:'var(--blue)',…}, milestone:'YYYY-MM-DD'|null}
 * WEEKS  — optional {'M/D–M/D':[{d:'M/D Mon',items:['…']}]}
 * ──────────────────────────────────────────────────────────────────── */
/* __DATA_START__ */const DATA=[];/* __DATA_END__ */
/* __SYNC_START__ */const SYNC='';/* __SYNC_END__ */
/* __VBASE_START__ */const VBASE='';/* __VBASE_END__ */
/* __OKR_START__ */const OKR={ON:{},OC:{},milestone:null};/* __OKR_END__ */
/* __WEEKS_START__ */const WEEKS={};/* __WEEKS_END__ */

const ON=OKR.ON||{};
const OC=OKR.OC||{};
const PERF=OKR.milestone?new Date(OKR.milestone):null;
const WEEK_KEYS=Object.keys(WEEKS);
let weekTab=WEEK_KEYS[0]||'';

let filter='all', okrTab=Object.keys(OC)[0]||'';
const DIRS={proj:'01 - Projects',na:'02 - Next Actions',wf:'03 - Waiting For',ach:'07 - Achievements'};
function fLink(i){return VBASE?`file://${VBASE}/${DIRS[i.type]||''}/${i.fn}.md`:'#';}
function dd(d){if(!d)return null;return Math.round((new Date(d+'T00:00:00+08:00')-new Date(new Date().toDateString()))/864e5);}
function duB(d){if(d===null)return '';if(d<0)return `<span class="bd bov">overdue ${-d}d</span>`;if(d===0)return `<span class="bd btd">today</span>`;if(d<=3)return `<span class="bd bsn">${d}d</span>`;return `<span class="bd blt">${d}d</span>`;}
function prB(p){return p?`<span class="bd bp${p[1]||1}">${p}</span>`:'';}

function rI(i,o={}){
  const dc=i.days!==null&&i.days<=0?'dr':i.priority==='P1'?'da':i.type==='wf'?'dp':i.type==='ach'?'dg':'db';
  return `<a href="${fLink(i)}" class="it">
    <div class="dot ${dc}"></div>
    <div class="ic"><div class="in">${i.title||i.fn}</div><div class="is">${i.project&&!i.bl?`<span>${i.project}</span>`:''}${!o.hp&&i.owner?`<span style="color:var(--purple)">@${i.owner}</span>`:''}</div></div>
    <div class="ir">${i.okr?`<span class="bd bk">${i.okr}</span>`:''}${prB(i.priority)}${duB(i.days)}</div>
  </a>`;
}

function rC(label,count,body){
  return `<div class="card"><div class="ch"><div class="ct">${label}</div><div class="cc">${count}</div></div><div class="cb">${body||'<div class="em">empty</div>'}</div></div>`;
}

function render(){
  const all=DATA.map(d=>({...d,days:dd(d.due)}));
  const proj=all.filter(i=>i.type==='proj');
  const items=all.filter(i=>i.type!=='proj');
  const work=items.filter(i=>!i.bl),bl=items.filter(i=>i.bl);
  const na=work.filter(i=>i.type==='na'),wf=work.filter(i=>i.type==='wf'),ach=work.filter(i=>i.type==='ach');
  const urg=na.filter(i=>i.days!==null&&i.days<=0).sort((a,b)=>a.days-b.days);
  const wk=na.filter(i=>i.days!==null&&i.days>0&&i.days<=7).sort((a,b)=>a.days-b.days);
  const nd=na.filter(i=>!i.due);
  const wp={};wf.forEach(i=>{const p=i.owner||'unassigned';if(!wp[p])wp[p]=[];wp[p].push(i);});
  let fa=na;if(filter!=='all')fa=na.filter(i=>i.okr&&i.okr.startsWith(filter));
  const now=new Date();
  const dp=PERF?Math.round((PERF-now)/864e5):null;
  const ds=now.toLocaleDateString(undefined,{month:'long',day:'numeric',weekday:'long'});
  const pl=proj.filter(p=>!p.bl);

  const okrKRs={};
  Object.keys(ON).filter(k=>k.includes('-KR')).forEach(kr=>{okrKRs[kr]={planned:0,done:0,achs:[]};});
  work.forEach(i=>{
    if(!i.okr)return;
    const kr=i.okr;
    if(!okrKRs[kr])okrKRs[kr]={planned:0,done:0,achs:[]};
    if(i.type==='ach'){okrKRs[kr].achs.push(i);okrKRs[kr].done++;}
    else okrKRs[kr].planned++;
  });

  function renderOKR(){
    const tabs=`<div class="fb">${Object.keys(OC).map(o=>`<button class="fn ${okrTab===o?'on':''}" onclick="setOKR('${o}')">${ON[o]||o}</button>`).join('')}</div>`;
    const krs=Object.entries(okrKRs).filter(([k])=>k.startsWith(okrTab));
    const color=OC[okrTab]||'var(--blue)';
    let body='';
    krs.forEach(([kr,v])=>{
      const pct=v.planned+v.done>0?Math.round(v.done/(v.planned+v.done)*100):0;
      const achHtml=v.achs.length?v.achs.map(a=>`<a href="${fLink(a)}" class="kr-ach">${a.title}</a>`).join(''):'';
      body+=`<div class="kr-row">
        <div class="kr-head"><div class="kr-name">${ON[kr]||kr}</div><div class="kr-nums"><span>${v.done} done</span><span>${v.planned} active</span></div></div>
        <div class="kr-bar"><div class="kr-fill" style="width:${pct}%;background:${color}"></div></div>
        ${achHtml?`<div class="kr-achs">${achHtml}</div>`:`<div class="kr-empty">no achievements yet</div>`}
      </div>`;
    });
    return tabs+body;
  }

  const okrEnabled=Object.keys(OC).length>0;
  const weeklyEnabled=WEEK_KEYS.length>0;

  document.getElementById('app').innerHTML=`
    <div class="header"><div><div class="ht">Getting Things Done</div><div class="hd"><span>${ds}</span><button class="rb" onclick="refreshDashboard()" title="Refresh dashboard">↻</button></div></div>${dp!==null?`<div class="pb"><div class="pl">milestone</div><div><span class="pn">${dp}</span> <span class="pu">days</span></div></div>`:''}</div>

    <div class="sec"><div class="r2">
      ${rC('Due today',urg.length,urg.map(i=>rI(i)).join(''))}
      ${rC('This week',wk.length,wk.map(i=>rI(i)).join(''))}
    </div></div>

    ${weeklyEnabled?`<div class="sec"><div class="sl">Weekly</div><div class="card">
      <div class="ch"><div class="ct">Weekly
        <span style="color:var(--t3);margin:0 4px">|</span>
        <select onchange="setWeek(this.value)" style="font-size:13px;font-weight:500;border:none;background:transparent;color:var(--t2);cursor:pointer;outline:none;padding:0">
          ${WEEK_KEYS.map(k=>`<option value="${k}" ${k===weekTab?'selected':''}>${k}</option>`).join('')}
        </select>
      </div><div class="cc">${(WEEKS[weekTab]||[]).reduce((s,w)=>s+w.items.length,0)}</div></div>
      <div class="cb">
        ${(WEEKS[weekTab]||[]).map(w=>`<div class="plb">${w.d}</div>${w.items.map(t=>`<div class="it"><div class="dot dg"></div><div class="ic"><div class="in">${t}</div></div></div>`).join('')}`).join('')}
      </div>
    </div></div>`:''}

    ${okrEnabled?`<div class="sec"><div class="sl">OKR</div><div class="card"><div class="cb">${renderOKR()}</div></div></div>`:''}

    <div class="sec"><div class="r2">
      ${rC('Waiting for',wf.length,Object.entries(wp).map(([p,its])=>`<div class="plb">@${p}</div>${its.map(i=>rI(i,{hp:true})).join('')}`).join(''))}
      ${rC('Active projects',pl.length,pl.map(p=>`<a href="${fLink(p)}" class="it"><div class="ic"><div class="in">${p.title||p.fn}</div></div><div class="ir">${p.okr?`<span class="bd bk">${p.okr}</span>`:''}</div></a>`).join(''))}
    </div></div>

    <div class="sec"><div class="sl">All actions</div><div class="card">
      <div class="fb">${['all',...Object.keys(OC)].map(f=>`<button class="fn ${filter===f?'on':''}" onclick="setF('${f}')">${f==='all'?'All':(ON[f]||f)}</button>`).join('')}</div>
      <div class="cb">${fa.length?fa.sort((a,b)=>{const pa=a.priority||'P9',pb=b.priority||'P9';if(pa!==pb)return pa.localeCompare(pb);return(a.days??999)-(b.days??999);}).map(i=>rI(i)).join(''):'<div class="em">empty</div>'}</div>
    </div></div>

    ${nd.length?`<div class="sec"><div class="sl">No due date</div>${rC('Needs scheduling',nd.length,nd.map(i=>rI(i)).join(''))}</div>`:''}

    ${bl.length?`<div class="sec blw"><div class="sl">Side projects</div>${rC('Cards',bl.length,bl.filter(i=>i.days===null||i.days>=0).sort((a,b)=>(a.days??999)-(b.days??999)).slice(0,5).map(i=>`<a href="${fLink(i)}" class="it"><div class="dot dp"></div><div class="ic"><div class="in">${i.title||i.fn}</div></div><div class="ir">${duB(i.days)}</div></a>`).join('')+`<div class="em">latest 5 of ${bl.length}</div>`)}</div>`:''}

    <div class="sync">${SYNC?`Synced ${SYNC}`:'(not yet synced — run export_dashboard.py)'}</div>
  `;
}
function setF(f){filter=f;render();}
function setOKR(o){okrTab=o;render();}
function setWeek(w){weekTab=w;render();}
async function refreshDashboard(){
  const button=document.querySelector('.rb');
  if(button)button.classList.add('busy');
  try{
    const response=await fetch('http://127.0.0.1:8765/refresh',{cache:'no-store'});
    if(!response.ok)throw new Error(await response.text());
    location.reload();
  }catch(error){
    if(button)button.classList.remove('busy');
    alert('Refresh failed. Open GTD Dashboard.app or run: python3 export_dashboard.py');
  }
}
render();

// Auto-refresh: reload on focus if tab has been backgrounded > 5 min,
// so newly-exported SYNC/DATA shows up without a manual refresh.
(function(){
  let last = Date.now();
  const check = () => { if (Date.now() - last > 5*60*1000) location.reload(); };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
  window.addEventListener('focus', check);
  setInterval(() => { last = Date.now() - 6*60*1000; check(); }, 5*60*1000);
})();
</script>
</body>
</html>
